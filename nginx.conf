events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    sendfile on;

    # Rate limiting zones
    # A dashboard asks for a dozen endpoints at once, and the scan and
    # the receipt upload are slow. Sixty a minute meant the browser
    # and the smoke test ran into the limit and got a 503 for work
    # that had nothing wrong with it.
    limit_req_zone $binary_remote_addr zone=default_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=300r/m;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name my-financial-manager.online;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name my-financial-manager.online;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        # ---- Security headers ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- Cache policy ----
        # index.html and sw.js must NEVER be cached, otherwise the browser
        # pins the app to an old bundle hash and serves a blank page.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Hashed build assets are immutable - cache them hard.
        # Everything in /assets/ is content-hashed by the build, so a long
        # immutable cache is safe here and avoids the stale-bundle problem.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Health / readiness - proxied to the backend, not the SPA fallback
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /ready {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # Realtime / market-intel endpoints are mounted on the backend WITHOUT
        # the /api prefix. Without this block they fell through to the SPA
        # fallback and returned index.html, so fetch() got HTML instead of JSON.
        location /realtime/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Serve static frontend files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy to backend
        location /api/ {
            limit_req zone=default_limit burst=30 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Auth endpoints get a tighter limit
        location ~ ^/api/(login|register|google/url|supabase-exchange|guest)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Search endpoints - moderate limit
        location ~ ^/api/(search|shopping/price-comparison) {
            limit_req zone=search_limit burst=15 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
