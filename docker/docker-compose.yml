version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finmanager-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: finmanager
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finmanager_secret_2024}
      POSTGRES_DB: finmanager
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmanager -d finmanager"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finmanager-net

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: finmanager-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finmanager:finmanager_secret_2024@postgres:5432/finmanager
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SECRET_KEY: ${SECRET_KEY:-fin-manager-super-secret-key-production-2024}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DEBUG: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finmanager-net

  # Nginx Reverse Proxy (for HTTPS in production)
  nginx:
    image: nginx:alpine
    container_name: finmanager-proxy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - finmanager-net
    profiles:
      - production

networks:
  finmanager-net:
    name: finmanager-network
    driver: bridge
