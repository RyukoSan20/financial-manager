version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finmanager-db
    environment:
      POSTGRES_USER: finmanager
      POSTGRES_PASSWORD: finmanager_secret_2024
      POSTGRES_DB: finmanager
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmanager -d finmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: finmanager-api
    environment:
      DATABASE_URL: postgresql://finmanager:finmanager_secret_2024@postgres:5432/finmanager
      SUPABASE_URL: https://slrtkzgnwaovzvkjmfwz.supabase.co
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SECRET_KEY: your-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: finmanager-network
