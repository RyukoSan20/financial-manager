<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinManager" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Personal financial management - track income, expenses, budgets, and achieve your goals" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />
    
    <!-- Splash Screens -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>FinManager - Personal Finance</title>
    
    <!-- Theme bootstrap: applied BEFORE first paint so there is never a flash
         of the wrong theme, and so the browser's own auto-darkening never
         gets a chance to repaint the page. -->
    <script>
      (function () {
        var KEY = 'finmanager-theme';
        var LEGACY = 'theme';
        var stored = null;
        try {
          stored = localStorage.getItem(KEY) || localStorage.getItem(LEGACY);
        } catch (e) { /* storage blocked */ }

        // Normalise: older builds stored a JSON blob, newer ones a plain string.
        if (stored && typeof stored === 'string' && stored.trim().charAt(0) === '{') {
          try {
            var parsed = JSON.parse(stored);
            stored = parsed && (parsed.preference || parsed.theme || parsed.value);
          } catch (e) { stored = null; }
        }

        var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';

        var theme;
        if (mode === 'light' || mode === 'dark') {
          // An explicit user choice always wins over the OS preference.
          theme = mode;
        } else {
          // 'system' (or no choice yet): follow the OS.
          theme = (window.matchMedia &&
                   window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
        }

        var root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.style.backgroundColor = '#111827';
          root.style.color = '#f3f4f6';
        } else {
          root.classList.remove('dark');
          root.style.backgroundColor = '#f9fafb';
          root.style.color = '#111827';
        }
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-mode', mode);
        // Declares the palette to the UA so it stops auto-inverting colors.
        root.style.colorScheme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#111827' : '#3b82f6');
        }
      })();
    </script>

    <style>
      /* Critical CSS for fast first paint */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      html.dark body {
        background: #111827;
        color: #f3f4f6;
      }
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      }
      .app-loading svg {
        width: 64px;
        height: 64px;
        animation: pulse 2s infinite;
      }
      .app-loading p {
        color: white;
        margin-top: 16px;
        font-size: 14px;
        opacity: 0.9;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <svg fill="none" viewBox="0 0 24 24" stroke="white">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
        <p>Loading FinManager...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
