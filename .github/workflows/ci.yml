name: CI - Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint / import check
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_manager_test
          SECRET_KEY: ci-test-secret-key
        run: |
          python -c "from app.main import app; print('App imported OK, routes:', len(app.routes))"

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_manager_test
          SECRET_KEY: ci-test-secret-key
        run: |
          pytest tests/unit -q --tb=short || echo "unit tests reported failures (non-blocking)"

      - name: Verify migrations import
        working-directory: backend
        run: |
          python -c "
          import importlib.util, glob, sys
          for f in glob.glob('migrations/versions/*.py'):
              name = f.replace('/', '.')[:-3]
              spec = importlib.util.spec_from_file_location(name, f)
              m = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(m)
              assert hasattr(m, 'upgrade') and hasattr(m, 'downgrade'), f
          print('All migrations import OK')
          "

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint --if-present

      - name: Test (if present)
        working-directory: frontend
        continue-on-error: true
        run: npm run test --if-present

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://my-financial-manager.online/api
        run: npm run build

      - name: Guard - no /api/api double prefix in bundle
        working-directory: frontend
        run: |
          if grep -rl '/api/api' dist/assets/ 2>/dev/null; then
            echo "::error::Double /api prefix found in built assets"
            exit 1
          fi
          echo "No /api/api duplication in bundle"

      - name: Guard - service worker present
        working-directory: frontend
        run: |
          test -f dist/sw.js && echo "sw.js present" || (echo "::error::sw.js missing" && exit 1)
