name: CI - Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint / import check
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_manager_test
          SECRET_KEY: ci-test-secret-key
        run: |
          python -c "from app.main import app; print('App imported OK, routes:', len(app.routes))"

      # The tests have to be able to fail the build. A test that
      # reports a failure and is then ignored is not a test, and it is
      # how the broken Gmail import got as far as a deployment.
      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_manager_test
          SECRET_KEY: ci-test-secret-key
        run: |
          pytest tests/unit -q --tb=short

      # The route check. It answers the question the import check above
      # cannot: not "does the application import" but "are all the
      # routers really in it". A router that failed to import leaves
      # the application healthy and the routes missing.
      - name: Route smoke test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_manager_test
          SECRET_KEY: ci-test-secret-key
        run: |
          python ../scripts/smoke_test_routes.py

      # The route count. The number is written down so that a router
      # that quietly stops being mounted is caught by the diff, and not
      # by a reader who gets a 404.
      - name: Guard - the route count
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_manager_test
          SECRET_KEY: ci-test-secret-key
        run: |
          COUNT=$(python -c "from app.main import app; print(len(app.routes))")
          echo "the application has $COUNT routes"
          EXPECTED=$(grep -oE '^EXPECTED_ROUTE_COUNT=[0-9]+' ../scripts/route_count_guard.txt | cut -d= -f2)
          if [ -z "$EXPECTED" ]; then
            echo "::error::the expected route count is not written down"
            exit 1
          fi
          if [ "$COUNT" -lt "$EXPECTED" ]; then
            echo "::error::the route count went down: $COUNT, expected at least $EXPECTED"
            exit 1
          fi
          echo "the route count is at least $EXPECTED"

      - name: Verify migrations import
        working-directory: backend
        run: |
          python -c "
          import importlib.util, glob, sys
          for f in glob.glob('migrations/versions/*.py'):
              name = f.replace('/', '.')[:-3]
              spec = importlib.util.spec_from_file_location(name, f)
              m = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(m)
              assert hasattr(m, 'upgrade') and hasattr(m, 'downgrade'), f
          print('All migrations import OK')
          "

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint --if-present

      # no-undef is the guard that matters: a name used in a component
      # has to exist in the scope that brings it in. This is what caught
      # `language is not defined` in Budgets.jsx and the same class of
      # crash in four other files.
      - name: Guard - no undefined names
        working-directory: frontend
        run: |
          npx eslint src --ext .js,.jsx --max-warnings 100000 \
            --rule 'no-undef:error' \
            --rule 'no-dupe-keys:error' \
            --rule 'no-const-assign:error' \
            --rule 'no-dupe-args:error' \
            --rule 'no-unreachable:error' \
            --rule 'no-constant-condition:error' \
            --rule 'no-func-assign:error' \
            --rule 'no-import-assign:error' \
            --rule 'no-self-assign:error' \
            --rule 'no-unsafe-finally:error' \
            --rule 'use-isnan:error' \
            --rule 'valid-typeof:error' \
            --rule 'no-sparse-arrays:error' \
            --rule 'no-cond-assign:error' \
            --rule 'no-debugger:error' \
            --rule 'no-dupe-class-members:error'

      # The frontend tests. There is no `npm test` script in this
      # project, so the tests are run by hand. They are plain node
      # files, and each one prints its own count. A test that reports a
      # failure and is then ignored is not a test.
      - name: Run the frontend unit tests
        working-directory: frontend
        run: |
          set -e
          for t in \
            src/i18n/__tests__/terminology.test.js \
            src/i18n/__tests__/batchParity.test.js \
            src/utils/__tests__/idFormat.test.js \
            src/utils/__tests__/featureFlags.test.js \
            src/utils/__tests__/abTesting.test.js \
            src/utils/__tests__/budgetRecipes.test.js \
            src/utils/__tests__/scanDismissal.test.js \
            src/utils/__tests__/healthMetrics.test.js \
            src/utils/__tests__/gmailState.test.js \
            src/utils/__tests__/marketFormat.test.js \
            src/components/common/__tests__/honestEmptyState.test.js \
            src/data/__tests__/privacyManifest.test.js \
            src/pages/__tests__/marketPage.test.js
          do
            if [ -f "$t" ]; then
              node "$t" || exit 1
            fi
          done

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://my-financial-manager.online/api
        run: npm run build

      - name: Guard - no /api/api double prefix in bundle
        working-directory: frontend
        run: |
          if grep -rl '/api/api' dist/assets/ 2>/dev/null; then
            echo "::error::Double /api prefix found in built assets"
            exit 1
          fi
          echo "No /api/api duplication in bundle"

      - name: Guard - service worker present
        working-directory: frontend
        run: |
          test -f dist/sw.js && echo "sw.js present" || (echo "::error::sw.js missing" && exit 1)

  i18n:
    name: Translation Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These three guards catch the failures that a build cannot:
      # a key no language has, a translator called outside a component,
      # a helper used but never imported, and the same key written twice
      # where the second one quietly puts the English back.
      - name: Check every key exists in every language
        run: python3 scripts/check_i18n.py

      - name: Check every helper is imported
        run: python3 scripts/check_undefined.py

      - name: Check no key is written twice
        run: python3 scripts/check_duplicate_keys.py
