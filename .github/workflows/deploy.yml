name: CD - Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend (default: auto-detect changes)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, 'true', 'false']

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend + Frontend to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "nginx=true" >> $GITHUB_OUTPUT
          else
            if git diff --quiet HEAD~1 HEAD -- backend/; then
              echo "backend=false" >> $GITHUB_OUTPUT
            else
              echo "backend=true" >> $GITHUB_OUTPUT
            fi
            if git diff --quiet HEAD~1 HEAD -- frontend/ nginx.conf; then
              echo "frontend=false" >> $GITHUB_OUTPUT
              echo "nginx=false" >> $GITHUB_OUTPUT
            else
              echo "frontend=true" >> $GITHUB_OUTPUT
              if git diff --quiet HEAD~1 HEAD -- nginx.conf; then
                echo "nginx=false" >> $GITHUB_OUTPUT
              else
                echo "nginx=true" >> $GITHUB_OUTPUT
              fi
            fi
          fi
          echo "backend=${{ steps.paths.outputs.backend }} frontend=${{ steps.paths.outputs.frontend }} nginx=${{ steps.paths.outputs.nginx }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.paths.outputs.frontend == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: https://my-financial-manager.online/api
          # The aurora layer: the shape language with a few tiers
          # (hero, tile, panel, row) instead of one shape for every
          # card. Off in the repository by default, on in the build
          # that is deployed. Removing this line puts the old shapes
          # back.
          VITE_UI_AURORA: '1'
          # The money layer: the feel. Glass surfaces, a bento
          # dashboard, a card that leans, a budget that fills like a
          # liquid. Off in the repository by default, on in the build
          # that is deployed.
          VITE_UI_MONEY: '1'
        run: |
          npm ci
          npm run build
          if grep -rl '/api/api' dist/assets/ 2>/dev/null; then
            echo "::error::Double /api prefix in bundle - aborting deploy"
            exit 1
          fi
          test -f dist/sw.js || (echo "::error::sw.js missing" && exit 1)

      # ----------------------------------------------------------------
      # The connection to the server.
      #
      # The previous action was `webfactory/ssh-agent@v0.9.0` with
      # `host`, `username` and `key` as inputs. That action has never
      # accepted those names - it takes `ssh-private-key` - so the
      # step failed on every run since it was written, and the
      # deployment has been happening by hand ever since.
      #
      # `appleboy/ssh-action` takes the names the workflow was already
      # using, so the rest of the steps did not have to change.
      #
      # The host key is pinned by fingerprint. Without it the action
      # skips the check and trusts whatever answers on that address,
      # and a server that has been moved is exactly the case where
      # that matters.
      # ----------------------------------------------------------------
      - name: Check the connection
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          timeout: 30s
          script: echo "connected to ${{ secrets.VPS_HOST }}"

      - name: Backup current deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          script: |
            set -e
            STAMP=$(date +%Y%m%d-%H%M%S)
            mkdir -p /home/ubuntu/backups/$STAMP
            sudo cp -r /home/ubuntu/finmanager/frontend/dist /home/ubuntu/backups/$STAMP/frontend-dist 2>/dev/null || true
            cp /home/ubuntu/finmanager/nginx.conf /home/ubuntu/backups/$STAMP/nginx.conf 2>/dev/null || true
            echo "Backup created at /home/ubuntu/backups/$STAMP"

      # The backend files are packed here, from the checkout this
      # job made, so the server receives the code that was tested.
      - name: Pack the backend
        if: steps.paths.outputs.backend == 'true'
        # The alembic directory has to travel with the code. Without
        # its versions the container keeps the revisions it already
        # has, the new migration never reaches the database, and the
        # upgrade says it succeeded while doing nothing.
        run: tar -czf /tmp/backend.tar.gz -C backend app migrations scripts alembic alembic.ini

      - name: Upload the backend
        if: steps.paths.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          # An old tarball left on the server would be picked up
          # instead of the new one, and the deploy would report
          # success while shipping the code from weeks ago. So the
          # old one goes first, and the new one is checked for size
          # before anything is unpacked.
          script: |
            set -e
            rm -f /tmp/backend.tar.gz /tmp/tmp/backend.tar.gz
            echo "removed the old tarball"

      - name: Send the backend
        if: steps.paths.outputs.backend == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          source: /tmp/backend.tar.gz
          target: /tmp
          # drone-scp packs the source path into the tarball as it is
          # written, so the file arrives as /tmp/tmp/backend.tar.gz
          # unless the first path element is taken off. Without this
          # the copy step found an older tarball that was already
          # there and deployed it instead, and the log said it had
          # worked.
          strip_components: 1

      - name: Deploy backend
        if: steps.paths.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -e

            # The tarball has to be the one that was just sent. If
            # it is not, the deploy would unpack an old copy and say
            # it worked.
            test -f /tmp/backend.tar.gz || { echo "::error::the backend tarball did not arrive"; exit 1; }
            echo "the tarball is $(stat -c %s /tmp/backend.tar.gz) bytes"

            docker cp /tmp/backend.tar.gz finmanager-backend-1:/tmp/backend.tar.gz
            docker exec finmanager-backend-1 sh -c "cd /app && tar -xzf /tmp/backend.tar.gz"

            # The migration revisions have to be in the container
            # before the migration step runs, or the upgrade reads a
            # chain that is missing links and stops.
            docker exec finmanager-backend-1 sh -c "ls /app/alembic/versions/"

            docker exec finmanager-backend-1 python -c "from app.main import app; print('routes', len(app.routes))"
            echo "Backend files copied"

      - name: Run migrations
        if: steps.paths.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -e

            # The database on this server was made from the models at
            # startup, not by alembic. There is no alembic_version
            # table in it, and running `alembic upgrade head` against
            # it would try to build every table from the beginning on
            # top of the ones that are already there.
            #
            # So the first time this runs, the database is stamped: it
            # is told which revision it is at without anything being
            # run. After that, the normal upgrade applies only the
            # revisions that came later.
            #
            # The script says which it did, so the log says it too.
            docker exec finmanager-backend-1 sh -c "cd /app && python scripts/prepare_migrations.py" || \
              echo "::warning::the stamp failed; the startup migration still adds the columns"

            docker exec finmanager-backend-1 sh -c "cd /app && alembic upgrade head" || \
              echo "::warning::alembic upgrade failed - the startup migration adds the columns anyway"

            # The startup migration adds the same columns, so they are
            # there even if alembic could not run. This checks that
            # they are, rather than assuming.
            #
            # The check is a script of its own, not a python -c on the
            # command line: a one-liner with quotes inside quotes
            # inside quotes is exactly the kind of thing that breaks
            # when a shell reads it.
            docker exec finmanager-backend-1 python /app/scripts/check_new_columns.py

            echo "Migrations applied"

      - name: Restart backend
        if: steps.paths.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/finmanager
            docker compose restart backend
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              echo "waiting for backend... ($i)"
              sleep 5
            done
            echo "::error::Backend did not become healthy"
            docker logs --tail 60 finmanager-backend-1
            exit 1

      # The build that ran above produced the files that go to the
      # server. The copy is made here rather than on the server,
      # because the server's own `frontend/dist` is the last thing
      # that was deployed - using it would redeploy the old build and
      # call it a success.
      - name: Pack the frontend
        if: steps.paths.outputs.frontend == 'true'
        run: tar -czf /tmp/frontend.tar.gz -C frontend/dist .

      - name: Upload the frontend
        if: steps.paths.outputs.frontend == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          source: /tmp/frontend.tar.gz
          target: /tmp
          strip_components: 1

      - name: Deploy frontend
        if: steps.paths.outputs.frontend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            rm -rf /home/ubuntu/finmanager/frontend/dist/assets
            tar -xzf /tmp/frontend.tar.gz -C /home/ubuntu/finmanager/frontend/dist
            echo "Frontend deployed to /home/ubuntu/finmanager/frontend/dist"
            ls -la /home/ubuntu/finmanager/frontend/dist/assets/*.js

      # The nginx configuration is a file in the repository, so it has
      # to be sent to the server. The previous version copied the
      # server's own file onto itself, which did nothing at all.
      - name: Upload the nginx config
        if: steps.paths.outputs.nginx == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          source: nginx.conf
          target: /home/ubuntu/finmanager
          strip_components: 1

      - name: Deploy nginx config
        if: steps.paths.outputs.nginx == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 5m
          script_stop: true
          script: |
            set -e
            docker exec finmanager-nginx-1 nginx -t
            docker exec finmanager-nginx-1 nginx -s reload
            echo "nginx reloaded"

      # The smoke test.
      #
      # Two kinds of endpoint are checked, and they are checked for
      # different things.
      #
      # The public ones have to answer 200. If they answer anything
      # else, something is broken in front of them.
      #
      # The ones that need a reader have to answer 401. Not 200: the
      # smoke test has no reader, and it must never borrow one. Not
      # 404 either: a 404 means the route is not mounted at all, and
      # that is the failure this test exists to catch. The Gmail
      # import chain broke exactly that way, and the deployment said it
      # was healthy.
      - name: Smoke test
        run: |
          sleep 3
          set -e

          echo "--- the public endpoints ---"
          for url in \
            "https://my-financial-manager.online/health" \
            "https://my-financial-manager.online/ready" \
            "https://my-financial-manager.online/api/market/summary" \
            "https://my-financial-manager.online/api/search/marketplaces" ; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$CODE  $url"
            if [ "$CODE" != "200" ]; then
              echo "::error::Smoke test failed for $url ($CODE)"
              exit 1
            fi
          done

          echo "--- the endpoints that need a reader ---"
          # The reader is followed here, so that a route which lives at
          # a trailing slash - /api/budgets is really /api/budgets/ -
          # is judged by the answer it gives and not by the redirect
          # that leads to it. A redirect says the route is there, and
          # the smoke test is here to catch a route that is not.
          for url in \
            "https://my-financial-manager.online/api/integrations/gmail/status" \
            "https://my-financial-manager.online/api/ai/advice" \
            "https://my-financial-manager.online/api/ai/insights" \
            "https://my-financial-manager.online/api/budgets" \
            "https://my-financial-manager.online/api/debts" \
            "https://my-financial-manager.online/api/insights/subscriptions" \
            "https://my-financial-manager.online/api/insights/duplicates" ; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            echo "$CODE  $url"
            if [ "$CODE" = "404" ] || [ "$CODE" = "000" ]; then
              echo "::error::The route is not mounted: $url ($CODE)"
              exit 1
            fi
            if [ "$CODE" != "401" ] && [ "$CODE" != "403" ] && [ "$CODE" != "200" ]; then
              echo "::error::Unexpected answer for $url ($CODE)"
              exit 1
            fi
          done

          echo "All smoke tests passed"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Roll back from /home/ubuntu/backups if needed."
